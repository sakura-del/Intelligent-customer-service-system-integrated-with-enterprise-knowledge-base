[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# 规则集：E(pycodestyle) + F(pyflakes) + I(isort) + UP(pyupgrade) + B(bugbear)
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",   # 行长度由 formatter 管理
    "B008",   # FastAPI Depends() 在函数默认参数中是惯用写法
    "UP017",  # 使用 datetime.UTC 需要 Python 3.11+，当前运行环境为 3.10，保留 timezone.utc 写法
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
# 暂不强制严格类型检查，先覆盖基础
disallow_untyped_defs = false
check_untyped_defs = true

# 排除测试文件和迁移脚本
exclude = [
    "tests/",
    "docs/",
    "build/",
    "site/",
]
